name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a branch makes the run already in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Test
        # vitest only runs once instead of watching when CI is set, so ask for
        # a single run rather than depending on the environment.
        run: pnpm exec vitest run
      - name: Build
        run: pnpm run build
